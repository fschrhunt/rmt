name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command that shows it
      description: Remove private paths, prompts, tokens, and other sensitive details.
      render: sh
  - type: input
    id: environment
    attributes:
      label: Operating system and agent versions
