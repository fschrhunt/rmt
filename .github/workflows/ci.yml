name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Install ShellCheck if needed
        run: |
          if ! command -v shellcheck >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then brew install shellcheck; else sudo apt-get update && sudo apt-get install -y shellcheck; fi
          fi
      - name: Check workflow syntax
        if: runner.os == 'Linux'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
      - name: Check Homebrew formula syntax
        if: runner.os == 'macOS'
        run: |
          for target in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            printf '%064d  rmt_v0.0.0_%s.tar.gz\n' 0 "$target"
          done > "$RUNNER_TEMP/checksums.txt"
          scripts/formula.sh v0.0.0 "$RUNNER_TEMP/checksums.txt" > "$RUNNER_TEMP/rmt.rb"
          ruby -c "$RUNNER_TEMP/rmt.rb"
          if [ -f rmt.rb ]; then ruby -c rmt.rb; fi
      - run: ./x check
      - name: Audit reachable vulnerabilities
        if: runner.os == 'Linux'
        run: ./x audit
      - run: go test -race ./...
      - run: ./x build
      - name: Verify release archives
        if: runner.os == 'Linux'
        run: scripts/package.sh v0.0.0 "$RUNNER_TEMP/rmt-release"
